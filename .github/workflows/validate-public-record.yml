name: Public record validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-record-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate claims and evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the publication
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Test the publication gate
        run: python3 tools/test_public_record.py

      - name: Validate the public record
        run: python3 tools/validate_public_record.py
