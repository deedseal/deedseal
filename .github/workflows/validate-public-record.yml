name: Public record validation

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-record-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; every commit that lands on
  # main keeps a completed gate result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate claims and evidence
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
          - os: macos-latest
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out the publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test the publication gate
        run: ${{ matrix.python }} tools/test_public_record.py

      - name: Validate the public record
        run: ${{ matrix.python }} tools/validate_public_record.py

      - name: Run the demonstration target's contract tests
        run: ${{ matrix.python }} demo/tests/test_demo_contract.py

      - name: Require a published snapshot on the default branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ${{ matrix.python }} tools/validate_public_record.py --require-published

  gate:
    name: Publication gate
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix leg to pass
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = "success"
