name: Public record validation

on:
  pull_request:
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-record-${{ github.workflow }}-${{ github.ref }}
  # Only superseded pull-request runs are cancelled; every commit that lands on
  # main keeps a completed gate result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate claims and evidence
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: python3
          - os: windows-latest
            python: python
          - os: macos-latest
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out the publication
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test the publication gate
        run: ${{ matrix.python }} tools/test_public_record.py

      - name: Validate the public record
        run: ${{ matrix.python }} tools/validate_public_record.py

      - name: Validate the Evidence 2 target contract
        run: ${{ matrix.python }} tools/check_round_trip_v2_target.py

      - name: Run the existing demonstration target's contract tests
        run: ${{ matrix.python }} demo/tests/test_demo_contract.py

      # The published demonstration is re-proven on every change, never asserted:
      # the verifier must accept the real passport, refuse its twin, and the twin
      # must differ by exactly one byte. The checks live in a committed script
      # rather than inline in this file, so a reader runs the identical command
      # locally and CI has no assertion of its own to get wrong.
      - name: Re-prove the published demonstration
        run: ${{ matrix.python }} tools/check_demonstration.py

      # The count is the honest measure of this repository's evidence: it rises
      # only when another run's passport verifies, never when prose changes.
      - name: Count verified runs
        run: ${{ matrix.python }} tools/check_runs.py

      # Every derived file -- the README claim table, the run index, and every
      # ledger digest -- is regenerated in memory and compared to the tree, so a
      # hand-edited claim row or a stale digest fails here rather than shipping.
      - name: Refuse hand-edited derived files
        run: ${{ matrix.python }} tools/build_publication.py check

      - name: Require a published snapshot on the default branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ${{ matrix.python }} tools/validate_public_record.py --require-published

  gate:
    name: Publication gate
    needs: validate
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every matrix leg to pass
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = "success"
